name: test

on:
  push:
  pull_request:

jobs:
  linux-file:
    # Linux: the login is ~/.claude/.credentials.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y tmux
      - run: python3 -I test_cs.py --store file

  linux-keychain-shim:
    # The macOS keychain path driven through a stand-in for the security tool, on the oldest supported Python
    # (ubuntu-24.04: setup-python has no 3.9 build for the Ubuntu 26.04 that ubuntu-latest became)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: sudo apt-get install -y tmux
      - run: python3 -I test_cs.py --store keychain --fake-security

  macos:
    # macOS: the real security tool (the test suite creates a throw-away keychain inside its fake HOME), on the
    # Python that ships with the Xcode command line tools
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install tmux
      - name: Test with the system python3 (3.9) and the real security tool
        run: |
          PY=/usr/bin/python3; [ -x "$PY" ] || PY=python3
          "$PY" --version
          "$PY" -I test_cs.py --store keychain --real-security
